<style>
/* Layout: o mundo 3D ocupa a tela; HUD sobreposto — iniciativa no topo, ficha/crônica/dados à direita, barra de habilidades embaixo. */
:root{
  --bg:#050a14; --panel:rgba(9,15,27,.9); --panel2:#0f1a2d; --line:#22344f; --fg:#e4ebf3; --muted:#8c9db3;
  --abyss:#5cc6ff; --gold:#d9b46a; --blood:#e0503f; --poison:#86d266; --fire:#ff8f45;
  --f-display:"Cormorant SC","Cormorant Garamond",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
#app{position:fixed;inset:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(2,5,12,.65) 100%)}

.hud-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.hud-top>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.logo{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3vw,32px);line-height:1;letter-spacing:.04em;color:#dbe9f7;text-shadow:0 0 18px rgba(92,198,255,.35)}
.phase{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--abyss)}
.phase.combat{color:var(--blood)}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tbtn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 11px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px}
.tbtn:hover:not(:disabled){border-color:var(--abyss)}
.tbtn:disabled{opacity:.45;cursor:not-allowed}
.item select{max-width:150px;background:#070c16;border:1px solid var(--line);border-radius:4px;padding:4px}
.btn.small{padding:5px 9px;font-size:13px}
optgroup{background:#0f1a2d}
.tbtn.on{border-color:var(--gold);color:var(--gold)}
.tbtn svg{width:16px;height:16px}

.init{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));display:flex;gap:6px;max-width:min(92vw,900px);overflow-x:auto;padding:4px;pointer-events:auto}
.chip{flex:none;display:flex;flex-direction:column;gap:3px;min-width:84px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;cursor:pointer;font-size:12px}
.chip.act{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 18px rgba(217,180,106,.25)}
.chip.enemy .cn{color:#f0a89e}
.chip.down{opacity:.45}
.chip .cn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.chip .ci{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.mini{height:4px;background:#0a0f19;border-radius:2px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--blood)}
.chip.hero .mini i{background:#6fd08c}

.side{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(120px + env(safe-area-inset-top,0px));bottom:calc(118px + env(safe-area-inset-bottom,0px));width:330px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;padding:9px 6px;cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tab.on{color:var(--fg);box-shadow:inset 0 -2px 0 var(--abyss)}
.pane{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
@media (max-width:820px){.side{left:max(12px,env(safe-area-inset-left,0px));width:auto;top:auto;height:46%;bottom:calc(118px + env(safe-area-inset-bottom,0px))}}

.hname{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1}
.hsub{font-size:13px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:6px}
.barrow{display:grid;grid-template-columns:62px minmax(0,1fr) 58px;gap:8px;align-items:center;font-size:12px}
.barrow b{font-weight:500;color:var(--muted)}
.barrow span{font-family:var(--f-mono);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;background:#070c16;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blood);transition:width .25s}
.bar.res i{background:var(--abyss)} .bar.xp i{background:var(--gold)}
.attrs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;text-align:center}
.attr{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:4px 0}
.attr b{display:block;font-family:var(--f-mono);font-size:9px;color:var(--muted);font-weight:500;letter-spacing:.08em}
.attr span{font-family:var(--f-mono);font-size:15px}
.attr em{display:block;font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--gold)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;font-size:13px}
.facts div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dotted var(--line);padding:2px 0}
.facts span{color:var(--muted)}
.conds{display:flex;gap:5px;flex-wrap:wrap}
.cond{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;padding:2px 6px;border-radius:3px;border:1px solid var(--line);text-transform:uppercase}
.cond.poison{color:var(--poison);border-color:#2f5a2a}.cond.burn{color:var(--fire);border-color:#6b3a1c}.cond.stun{color:#f3d36b;border-color:#6b5a1c}.cond.guard,.cond.aura{color:var(--gold);border-color:#5f4c26}.cond.down{color:var(--blood);border-color:#5f241c}
.h3{margin:0;font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.story{font-size:13px;color:#c3cfdc;font-style:italic;white-space:pre-wrap}
.log{display:flex;flex-direction:column;gap:5px}
.le{font-size:13px;border-left:2px solid var(--line);padding-left:7px}
.le.hit{border-color:var(--blood)} .le.heal{border-color:#6fd08c} .le.sys{border-color:var(--abyss)} .le.gm{border-color:var(--gold)}
.le small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.dicebtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.dbtn{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:7px 0;cursor:pointer;font-family:var(--f-mono);font-size:13px}
.dbtn:hover{border-color:var(--abyss)}
.drow{display:flex;gap:6px;align-items:center;font-size:13px}
.drow input{width:56px;background:#070c16;border:1px solid var(--line);border-radius:4px;padding:5px;font-family:var(--f-mono)}
.dhist{display:flex;flex-direction:column;gap:5px}
.dh{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;align-items:center;font-size:12px;border-bottom:1px dotted var(--line);padding-bottom:4px}
.dh .big{font-family:var(--f-mono);font-size:18px;text-align:center;color:var(--fg)}
.dh .big.c20{color:var(--gold)} .dh .big.c1{color:var(--blood)}
.dh small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:10px;overflow-wrap:anywhere}

.hotbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:stretch;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;max-width:calc(100vw - 24px);overflow-x:auto}
.hb-who{display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:120px;padding-right:6px;border-right:1px solid var(--line)}
.hb-who b{font-family:var(--f-display);font-size:18px;line-height:1}
.hb-who small{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.ab{position:relative;flex:none;width:62px;height:66px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px}
.ab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ab .an{font-size:10px;line-height:1.1;text-align:center;color:#c9d6e4;max-width:58px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ab .cost{position:absolute;top:2px;right:3px;font-family:var(--f-mono);font-size:9px;color:var(--abyss)}
.ab .key{position:absolute;top:2px;left:4px;font-family:var(--f-mono);font-size:9px;color:var(--muted)}
.ab .cdv{position:absolute;inset:0;border-radius:7px;background:rgba(3,6,12,.72);display:grid;place-items:center;font-family:var(--f-mono);font-size:18px;color:var(--fg)}
.ab:hover:not(:disabled){border-color:var(--abyss)}
.ab.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.ab:disabled{opacity:.42;cursor:not-allowed}
.ab.end{width:78px;background:#1a1407;border-color:#5f4c26;color:var(--gold)}
.ab.move.sel{border-color:var(--abyss);box-shadow:0 0 0 1px var(--abyss)}

.tip{position:absolute;z-index:30;pointer-events:none;background:rgba(5,9,18,.95);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:12px;max-width:280px;display:flex;flex-direction:column;gap:2px}
.tip b{font-size:13px}
.tip .warn{color:var(--fire)}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:clamp(30px,6vw,56px);font-weight:700;letter-spacing:.06em;text-shadow:0 0 30px rgba(0,0,0,.9),0 0 18px rgba(92,198,255,.4);pointer-events:none;text-align:center;line-height:1.05}
.banner small{display:block;font-family:var(--f-body);font-size:16px;font-weight:400;letter-spacing:0;color:#c9d6e4;margin-top:8px}
.rollpop{position:absolute;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(5,9,18,.94);border:1px solid var(--line);border-radius:8px;padding:8px 12px;pointer-events:none;max-width:92vw}
.rollpop .d20{width:40px;height:40px;position:relative;flex:none}
.rollpop .d20 svg{width:100%;height:100%}
.rollpop .d20 b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:15px;padding-top:2px}
.rollpop .txt{font-size:13px}
.rollpop .txt small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}

.drawer{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(56px + env(safe-area-inset-top,0px));width:310px;max-height:calc(100% - 200px);overflow-y:auto;background:rgba(7,12,22,.97);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;z-index:20}
.drawer h2{margin:0;font-family:var(--f-display);font-size:24px}
.drawer.gm{border-color:#5f4c26}
.drawer.gm h2{color:var(--gold)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{background:#070c16;border:1px solid var(--line);border-radius:5px;padding:7px 9px;min-width:0;width:100%;box-sizing:border-box}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn:hover:not(:disabled){border-color:var(--abyss)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.go{background:#0e2238;border-color:#2b5b85}
.btn.gold{background:#1a1407;border-color:#5f4c26;color:var(--gold)}
.btn.danger{border-color:#6a2a22}
.btn small{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.note{font-size:12px;color:var(--muted);margin:0}
:focus-visible{outline:2px solid var(--abyss);outline-offset:2px}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(2,5,10,.78);display:grid;place-items:center;padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:#08101e;border:1px solid var(--line);border-radius:10px;width:100%;max-width:640px;padding:22px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;box-shadow:0 30px 90px rgba(0,0,0,.7)}
.modal.wide{max-width:1040px}
.modal.mission-book{min-width:0;max-width:min(1040px,calc(100vw - 28px));max-height:calc(100dvh - 28px);overflow-y:auto;overflow-wrap:anywhere}
.modal h1{margin:0;font-family:var(--f-display);font-size:clamp(32px,5vw,50px);line-height:1;font-weight:700;text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--abyss)}
.lead{margin:0;font-size:17px;color:#c9d6e4;max-width:62ch}
.create{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px}
@media (max-width:760px){.create{grid-template-columns:minmax(0,1fr)}}
.preview{background:radial-gradient(ellipse at 50% 70%,#123056 0%,#060c18 70%);border:1px solid var(--line);border-radius:8px;position:relative;min-height:340px;overflow:hidden}
.preview canvas{position:absolute;inset:0;width:100%;height:100%}
.preview .pv-cap{position:absolute;left:10px;bottom:8px;font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:14px}
.slot.on{border-color:var(--abyss);box-shadow:inset 0 -2px 0 var(--abyss)}
.form{display:flex;flex-direction:column;gap:10px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:#fff}
.pb{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.pbc{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:4px;text-align:center;display:flex;flex-direction:column;gap:2px}
.pbc b{font-family:var(--f-mono);font-size:10px;color:var(--muted);font-weight:500}
.pbc span{font-family:var(--f-mono);font-size:16px}
.pbc em{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--gold)}
.pbc .pm{display:flex;gap:2px;justify-content:center}
.pbc .pm button{width:22px;height:20px;padding:0;background:#070c16;border:1px solid var(--line);border-radius:3px;cursor:pointer;font-family:var(--f-mono);font-size:12px}
.clsdesc{font-size:13px;color:#b9c6d4;margin:0}
.rules{display:flex;flex-direction:column;gap:10px;font-size:15px;max-width:68ch}
.rules h3{margin:4px 0 0;font-family:var(--f-display);font-size:22px}
.rules p{margin:0;color:#c9d6e4}
.status{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.status{grid-template-columns:minmax(0,1fr)}}
.status ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:#c9d6e4}
.status h3{margin:0 0 6px;font-family:var(--f-display);font-size:22px}
.ok{color:#8fe0a6}.pend{color:var(--fire)}
.toast{position:absolute;left:50%;top:calc(120px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(5,9,18,.95);border:1px solid var(--abyss);border-radius:6px;padding:8px 14px;font-size:14px;z-index:40;max-width:min(90vw,520px);text-align:center;pointer-events:none}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.direction-card{border:1px solid var(--line);border-radius:6px;padding:10px;background:rgba(16,20,27,.65);display:block}
.direction-card summary{cursor:pointer;color:var(--gold);font-weight:700;margin-bottom:8px}
.direction-card .field{margin:8px 0}
.direction-card textarea{width:100%;box-sizing:border-box;background:#090e18;border:1px solid var(--line);border-radius:4px;padding:8px}
.preview-tools{position:absolute;bottom:30px;left:8px;right:8px;display:flex;gap:5px;flex-wrap:wrap}
.preview-tools button{font-size:12px;padding:5px 8px;background:#111923}
.preview .pv-cap{pointer-events:none}
html[data-terror="2"] .vignette{background:radial-gradient(ellipse at center,transparent 45%,rgba(2,5,12,.68) 100%)}
html[data-terror="0"] .vignette{opacity:.5}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>

<div id="app">
  <canvas id="gl" tabindex="0" aria-label="Mundo 3D: cripta e ponte sobre o abismo"></canvas>
  <div class="vignette"></div>
  <header class="hud-top">
    <div class="brand"><span class="logo">Ecos do Abismo</span><span class="phase" id="phase">Preparando a descida</span></div>
    <nav class="tools" id="tools">
      <button class="tbtn" id="btnNet" type="button">Online</button>
      <button class="tbtn" id="btnSide" type="button">Painel</button>
      <button class="tbtn" id="btnMissions" type="button">Missões</button>
      <button class="tbtn" id="btnGM" type="button">Mestre</button>
      <button class="tbtn" id="btnArsenal" type="button">Arsenal</button>
      <button class="tbtn" id="btnShop" type="button">Mascate</button>
      <button class="tbtn" id="btnOpts" type="button">Opções</button>
      <button class="tbtn" id="btnRules" type="button">Regras</button>
      <button class="tbtn" id="btnStatus" type="button">O que já funciona</button>

    <div class="tabs">
      <button class="tab on" data-tab="sheet" type="button">Ficha</button>

      <button class="tab" data-tab="log" type="button">Crônica</button>
      <button class="tab" data-tab="dice" type="button">Dados</button>

    <div class="pane" id="pane"></div>
  </aside>
  <div class="hotbar" id="hotbar" hidden></div>
  <div class="rollpop" id="rollpop" hidden></div>

</div>
<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
'use strict';

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = id => document.getElementById(id);
const rnd = n => tapeRoll(n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sgn = n => (n >= 0 ? '+' : '−') + Math.abs(n);
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);

function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
function rollExpr(expr){
  const m = String(expr).replace(/\s/g, '').match(/^(\d*)d(\d+)([+-]\d+)?$/);
  if (!m) { const n = parseInt(expr, 10) || 0; return {total:n, rolls:[], bonus:n}; }
  const n = +(m[1] || 1), s = +m[2], b = +(m[3] || 0);
  const rolls = []; for (let i = 0; i < n; i++) rolls.push(rnd(s));
  return {total: Math.max(0, rolls.reduce((a, c) => a + c, 0) + b), rolls, bonus:b};
}
function doubleDice(expr){ const m = String(expr).match(/^(\d*)d(\d+)(.*)$/); return m ? `${(+(m[1]||1))*2}d${m[2]}${m[3]}` : expr; }

const WEAPONS = {};
const WEAPON_LIST = [];
(function buildArsenal(){
  let idx = 0;
  for (const fam in ARSENAL){
    ARSENAL[fam].forEach((row, i) => {
      const [n, dice, type, hands, w, p, propStr, model] = row;
      const id = fam + '_' + i;
      const props = {};
      for (const tok of propStr.split(/\s+/).filter(Boolean)){
        const [k, v] = tok.split(':');
        if (v === undefined) props[k] = true;
        else if (k === 'd' || k === 't'){ const [a, b] = v.split('/').map(Number); props[k === 'd' ? 'dist' : 'arremesso'] = [a, b]; }
        else if (['a','q','rep','cone','area'].includes(k)) props[{a:'alcance', q:'qty', rep:'rep'}[k] || k] = +v;
        else if (k === 'v') props.versatil = v;
        else if (k === 'mun') props.municao = v;
        else props[k] = v;
      }
      const attr = props.attr || FAMILIES[fam].attr;
      delete props.attr;
      const def = {id, n, fam, dice, type, hands, w, p, props, attr, m:String(model).split(',').map(Number), idx:++idx};
      def.ranged = !!(props.dist || props.cone || (fam === 'arremesso'));
      def.reach = props.alcance || 1;
      WEAPONS[id] = def; WEAPON_LIST.push(def);
    });
  }
})();

function propList(def){
  const out = [];
  for (const k in def.props){
    const v = def.props[k];
    if (k === 'dist') out.push(`à distância ${v[0]}/${v[1]}`);
    else if (k === 'arremesso') out.push(`arremesso ${v[0]}/${v[1]}`);
    else if (k === 'alcance') out.push(`alcance ${v}`);
    else if (k === 'versatil') out.push(`versátil (${v})`);

  }

}

const AU = {ctx:null, master:null, noise:null};
function audioInit(){
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    AU.ctx = new C();
    AU.master = AU.ctx.createGain(); AU.master.gain.value = SET.sound ? .55 : 0; AU.master.connect(AU.ctx.destination);
    const len = AU.ctx.sampleRate * 2, b = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
    AU.noise = b;
    startAmbient();
  } catch(e){ AU.ctx = null; }
}
function setSound(on){ SET.sound = on; saveSet(); if (AU.master) AU.master.gain.value = on ? .55 : 0; }
function envGain(t, a, peak, d){ const g = AU.ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(.0002, peak), t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); return g; }
function nz({f=800, to=null, q=1, type='lowpass', dur=.3, vol=.4, delay=0, a=.008}={}){
  if (!AU.ctx) return; const c = AU.ctx, t = c.currentTime + delay;
  const s = c.createBufferSource(); s.buffer = AU.noise; s.loop = true;
  const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); if (to) fl.frequency.exponentialRampToValueAtTime(to, t + dur); fl.Q.value = q;
  const g = envGain(t, a, vol, dur); s.connect(fl); fl.connect(g); g.connect(AU.master); s.start(t); s.stop(t + a + dur + .05);
}
function tn({f=440, to=null, type='sine', dur=.3, vol=.25, delay=0, a=.01}={}){
  if (!AU.ctx) return; const c = AU.ctx, t = c.currentTime + delay;
  const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  const g = envGain(t, a, vol, dur); o.connect(g); g.connect(AU.master); o.start(t); o.stop(t + a + dur + .05);
}
function sfx(name){
  if (!AU.ctx || !SET.sound) return;
  switch (name){
    case 'swing': nz({type:'bandpass', f:600, to:2600, q:1.2, dur:.18, vol:.35}); break;
    case 'hit': tn({f:140, to:60, dur:.18, vol:.5}); nz({f:1800, to:300, dur:.12, vol:.35}); break;
    case 'clang': tn({f:820, type:'triangle', dur:.25, vol:.18}); tn({f:1230, type:'triangle', dur:.18, vol:.1}); nz({f:4000, type:'highpass', dur:.06, vol:.2}); break;
    case 'miss': nz({type:'bandpass', f:1200, to:500, dur:.15, vol:.18}); break;
    case 'fire': nz({f:300, to:2400, dur:.45, vol:.35}); break;
    case 'boom': nz({f:1200, to:80, dur:.9, vol:.7, a:.004}); tn({f:90, to:35, dur:.7, vol:.6}); break;
    case 'zap': for (let i = 0; i < 6; i++) tn({f:200 + Math.random()*1200, type:'square', dur:.05, vol:.08, delay:i*.04}); nz({type:'highpass', f:3000, dur:.3, vol:.15}); break;
    case 'arcane': tn({f:660, to:1320, type:'triangle', dur:.25, vol:.15}); break;
    case 'holy': [523,659,784,1046].forEach((f,i) => tn({f, type:'sine', dur:.9, vol:.08, delay:i*.03, a:.05})); break;
    case 'heal': [392,494,587,784].forEach((f,i) => tn({f, dur:.35, vol:.1, delay:i*.08})); break;
    case 'guard': tn({f:220, type:'triangle', dur:.5, vol:.15}); tn({f:330, type:'triangle', dur:.5, vol:.1, delay:.05}); break;
    case 'step': nz({f:500, dur:.05, vol:.06}); break;
    case 'dice': for (let i = 0; i < 5; i++) nz({type:'bandpass', f:2500 + Math.random()*1500, q:4, dur:.03, vol:.25, delay:i*.06 + Math.random()*.02}); break;
    case 'death': tn({f:300, to:60, type:'sawtooth', dur:.8, vol:.12}); break;
    case 'roar': tn({f:110, to:70, type:'sawtooth', dur:.9, vol:.2}); nz({f:700, to:200, dur:.9, vol:.25}); break;
    case 'spider': for (let i = 0; i < 8; i++) nz({type:'bandpass', f:3500, q:6, dur:.02, vol:.2, delay:i*.035}); break;
    case 'bones': for (let i = 0; i < 4; i++) nz({type:'bandpass', f:1500 + i*300, q:5, dur:.04, vol:.25, delay:i*.05}); break;
    case 'blink': tn({f:900, to:200, type:'sine', dur:.3, vol:.15}); tn({f:200, to:900, dur:.3, vol:.15, delay:.3}); break;
    case 'rift': tn({f:60, to:40, type:'sawtooth', dur:1.2, vol:.25}); nz({f:200, to:1200, dur:1, vol:.3}); break;
    case 'reveal': [196,247,294].forEach((f,i) => tn({f, type:'triangle', dur:1.6, vol:.08, delay:i*.15, a:.2})); break;
    case 'turn': tn({f:440, type:'triangle', dur:.15, vol:.08}); break;
    case 'gun': nz({f:2500, to:150, dur:.35, vol:.7, a:.002}); tn({f:120, to:40, dur:.3, vol:.4}); break;
    case 'bow': tn({f:180, to:90, type:'triangle', dur:.12, vol:.18}); nz({type:'bandpass', f:1800, to:900, dur:.12, vol:.15}); break;
    case 'level': [523,659,784,1046,1318].forEach((f,i) => tn({f, dur:.3, vol:.1, delay:i*.07})); break;
  }
}
function startAmbient(){
  const c = AU.ctx;
  const g = c.createGain(); g.gain.value = 0; g.connect(AU.master); AU.dreadGain=g;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220; lp.connect(g);
  for (const f of [55, 55.6, 82.4]){ const o = c.createOscillator(); o.frequency.value = f; o.connect(lp); o.start(); }
  const wind = c.createBufferSource(); wind.buffer = AU.noise; wind.loop = true;
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 380; bp.Q.value = .6;
  const wg = c.createGain(); wg.gain.value = 0; AU.windGain=wg; wind.connect(bp); bp.connect(wg); wg.connect(AU.master); wind.start();
  // O diretor controla o vento para permitir silêncio real entre eventos.
  const drip = () => { if (SET.sound && AU.ctx && SET.horror>0 && G.mode==='explore' && !document.hidden && DIRECTOR.elapsed>DIRECTOR.quiet){ tn({f:1400 + Math.random()*600, to:700, dur:.12, vol:.05}); tn({f:900, to:500, dur:.12, vol:.02, delay:.35}); } setTimeout(drip, 2500 + Math.random()*6000); };
  const bell = () => { if (SET.sound && AU.ctx && SET.horror>0 && G.mode==='explore' && !document.hidden && DIRECTOR.elapsed>DIRECTOR.quiet){ tn({f:146.8, type:'triangle', dur:4, vol:.035, a:.02}); tn({f:220, type:'sine', dur:3, vol:.02, a:.02}); } setTimeout(bell, 22000 + Math.random()*25000); };
  setTimeout(drip, 3000); setTimeout(bell, 9000);
}

const TX = {};
function cnv(w, hh){ const c = document.createElement('canvas'); c.width = w; c.height = hh; return [c, c.getContext('2d')]; }
function toTex(c, rep, srgb=true){ const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; if (rep) t.repeat.set(rep[0], rep[1]); if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t; }
function speckle(g, w, hh, n, a, lo=0, hi=255){ for (let i = 0; i < n; i++){ const v = lo + Math.random()*(hi-lo) | 0; g.fillStyle = `rgba(${v},${v},${v},${Math.random()*a})`; const s = 1 + Math.random()*3; g.fillRect(Math.random()*w, Math.random()*hh, s, s); } }
function buildTextures(){
  let c, g;

const lin = c => (c && c.isColor) ? c : new THREE.Color(c).convertSRGBToLinear();
function std(color, o){ const m = new THREE.MeshStandardMaterial(Object.assign({roughness:.75, metalness:.05}, o || {})); m.color = lin(color); if (o && o.emissive != null && !o.emissive.isColor) m.emissive = lin(o.emissive); return m; }

function fxLight(pos, color, intensity, dist, dur){
  if (!SET.flashes || SET.reduced) intensity=0;
  const slot = W3.fxLights.reduce((a, b) => a.until < b.until ? a : b);
  slot.L.color.setHex(color); slot.L.position.copy(pos); slot.L.distance = dist; slot.from = intensity * (SET.reduced ? .5 : 1); slot.t0 = performance.now(); slot.dur = dur*1000; slot.until = slot.t0 + slot.dur;
  slot.L.intensity = slot.from;
  return slot;
}

function gothicArchShape(w, hh, inner){
  const s = new THREE.Shape(); const r = w/2;
  s.moveTo(-r, 0); s.lineTo(-r, hh - r*1.2); s.quadraticCurveTo(-r, hh, 0, hh + r*.4); s.quadraticCurveTo(r, hh, r, hh - r*1.2); s.lineTo(r, 0); s.lineTo(-r, 0);
  if (inner){ const ri = r*.72, hi = hh*.9; const p = new THREE.Path(); p.moveTo(-ri, .05); p.lineTo(-ri, hi - ri*1.2); p.quadraticCurveTo(-ri, hi, 0, hi + ri*.4); p.quadraticCurveTo(ri, hi, ri, hi - ri*1.2); p.lineTo(ri, .05); p.lineTo(-ri, .05); s.holes.push(p); }
  return s;
}
function flame(x, y, z, scale=1){
  const g = new THREE.Group(); g.position.set(x, y, z);
  const core = mk(new THREE.ConeGeometry(.07*scale, .26*scale, 8), new THREE.MeshBasicMaterial({color:0xffc46b}), 0, .1*scale, 0, false); g.add(core);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:TX.glow, color:0xff9a3d, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true, opacity:.9})); spr.scale.set(.9*scale, 1.1*scale, 1); spr.position.y = .1*scale; g.add(spr);
  g.userData.spr = spr; g.userData.core = core; g.userData.sc = scale;
  W3.torches.push(g);
  return g;
}

function applyCond(u, key, turns, extra={}){

  u.conds[key] = {t:Math.max(cur ? cur.t : 0, Math.min(C.max, turns)), dc:Math.max(cur ? cur.dc || 0 : 0, extra.dc || 0), src:extra.src || (cur && cur.src) || null};

async function startOfTurnConds(u){

}
async function endOfTurnConds(u){
  if (!u.alive || u.down) return;

    }

}
async function damage(u, amount, {type='', src=null}={}){
  if (!u.alive || u.down) return 0;

function sinkCorpse(u){ let t = 0; addFx(dt => { t += dt; if (t > 1.6) u.m.root.position.y -= dt * .6; if (t > 3.6){ u.m.root.visible = false; return false; } }); }

/* =====================================================================
   LINHA DE VISÃO E COBERTURA
   ===================================================================== */
function lineTiles(a, b){
  const out = [], n = Math.max(Math.abs(b.c - a.c), Math.abs(b.r - a.r)) * 4; let last = '';
  for (let i = 1; i < n; i++){
    const t = i / n, c = Math.round(a.c + (b.c - a.c)*t), r = Math.round(a.r + (b.r - a.r)*t), k = c + ',' + r;
    if (k !== last && !(c === a.c && r === a.r) && !(c === b.c && r === b.r)){ out.push([c, r]); last = k; }
  }
  return out;
}
function losInfo(from, to, ignore=[]){
  let cover = 0, blocked = false, by = '';
  for (const [c, r] of lineTiles(from, to)){
    if (r >= 0 && r < GH && c >= 0 && c < GW && MAP[r][c] === 'P'){ blocked = true; by = 'um pilar'; break; }
    const u = unitAt(c, r); if (u && !ignore.includes(u) && !u.down && !hidden(u)){ cover = 2; by = u.name; }
  }
  return {blocked, cover, by};
}

function attackProfile(u, item, mode='main'){
  if (u.side !== 'hero') return {def:null, monster:true, ranged:false, reach:1, normal:1, long:1, dice:MONSTERS[u.kindKey].dice, type:MONSTERS[u.kindKey].type, attr:null, name:'Ataque'};
  const d = item && !item.thrownOut ? wdef(item) : null;
  if (!d || d.shield) return {def:null, item:null, unarmed:true, ranged:false, reach:1, normal:1, long:1, dice:'1d4', type:'cont', attr:'FOR', name:'Golpe desarmado'};
  const thrown = mode === 'throw' || d.fam === 'arremesso';
  let ranged = false, normal = d.reach, long = d.reach;
  if (thrown && d.props.arremesso){ ranged = true; [normal, long] = d.props.arremesso; }
  else if (d.props.dist){ ranged = true; [normal, long] = d.props.dist; }
  else if (d.props.cone){ ranged = true; normal = long = d.props.cone; }
  let attr = d.attr;
  if (d.props.acuidade || d.props.forca) attr = modOf(u, 'DES') > modOf(u, 'FOR') ? 'DES' : 'FOR';
  let dice = d.dice;
  if (d.props.versatil && mode !== 'off' && !offDef(u) && !thrown) dice = d.props.versatil;
  return {def:d, item, thrown, ranged, reach:d.reach, normal, long, dice, type:d.type, attr, name:d.n, cone:d.props.cone, area:d.props.area, save:d.props.save, mode};
}
const isMeleeMain = u => { const P = attackProfile(u, mainItem(u)); return !P.ranged; };
function needsReload(u){ const it = mainItem(u), d = wdef(it); if (!d || d.shield || it.thrownOut) return false; if ((d.props.recarga || d.props.carregamento || d.props.pistao) && !it.loaded) return true; if (d.props.rep && it.mag <= 0) return true; return false; }
function reloadAct(u){ const it = mainItem(u), d = wdef(it); return d && (d.props.carregamento || (d.props.rep && it.mag <= 0)) ? 'acao' : 'bonus'; }
function ammoProblem(u, P){
  if (!P || !P.def) return '';

  if (d.props.municao && (u.ammo[d.props.municao] || 0) <= 0) return `Sem ${AMMO[d.props.municao].n.toLowerCase()}.`;
  if ((d.props.recarga || d.props.carregamento) && it && !it.loaded) return 'Arma descarregada: recarregue.';
  if (d.props.rep && it && it.mag <= 0) return 'Pente vazio: recarregue.';
  if (P.thrown && d.fam === 'arremesso' && !d.props.retornavel && it && (it.qty || 0) <= 0) return 'Nada para arremessar.';
  return '';
}
function abilityList(u){

function abilityInfo(u, id){

    const P = attackProfile(u, mainItem(u), id === 't_arremesso' ? 'throw' : 'main'); return Object.assign({}, ab, {range:P.long, dice:P.dice});
  }

}
function actOf(u, id){ const a = ABILITIES[id].act; return a === 'auto' ? reloadAct(u) : a; }
function canUse(u, id){

  if (G.mode === 'explore' && !['luz_cura','pocao','passo','trocar','recarregar','t_focos'].includes(id)) return {ok:false, why:'Fora de combate: curas, poções, troca de conjunto, recarga e Passo Sombrio.'};

  }
  if ((u.cd[id] || 0) > 0) return {ok:false, why:`Recarga: ${u.cd[id]} rodada(s).`};
  if (ab.cost && (u.res || 0) < ab.cost) return {ok:false, why:`${u.side === 'hero' ? CLASSES[u.clsKey].res : 'Recurso'} insuficiente.`};
  if (ab.req === 'corpo' && u.side === 'hero' && !isMeleeMain(u)) return {ok:false, why:'Exige uma arma corpo a corpo na mão principal.'};
  if (id === 'pocao' && !(u.items?.pocao > 0)) return {ok:false, why:'Sem poções.'};
  if (id === 'b_fenda' && G.telegraph) return {ok:false, why:'Já existe uma fenda marcada.'};
  if (u.side === 'hero' && ['ataque','radiante','t_espadas','t_laminas','t_machados','t_impacto','t_haste','t_arcos','t_flexiveis','t_punho','t_artifice'].includes(id)){ const why = ammoProblem(u, attackProfile(u, mainItem(u))); if (why) return {ok:false, why}; }
  if (id === 't_artifice' && mainItem(u) && mainItem(u).loaded === false) return {ok:false, why:'Exige a arma carregada.'};
  if (id === 'arremessar' || id === 't_arremesso'){ const why = ammoProblem(u, attackProfile(u, mainItem(u), 'throw')); if (why) return {ok:false, why}; }
  if (id === 'secundario'){ const od = offDef(u); const P = od && !od.shield ? attackProfile(u, offItem(u), 'off') : attackProfile(u, mainItem(u), mainDef(u)?.props.rapida ? 'throw' : 'main'); const why = ammoProblem(u, P); if (why) return {ok:false, why}; }
  if (id === 'trocar' && G.mode === 'combat' && u.swapped) return {ok:false, why:'Só uma troca de equipamento por turno.'};

}
function targetProfile(u, id){
  if (id === 'arremessar' || id === 't_arremesso') return attackProfile(u, mainItem(u), 'throw');
  if (id === 'secundario'){ const od = offDef(u); return od && !od.shield ? attackProfile(u, offItem(u), 'off') : attackProfile(u, mainItem(u), mainDef(u)?.props.rapida ? 'throw' : 'main'); }
  return attackProfile(u, mainItem(u));
}
const WEAPON_ABILITIES = ['ataque','arremessar','secundario','radiante','t_espadas','t_laminas','t_machados','t_impacto','t_haste','t_arcos','t_arremesso','t_flexiveis','t_punho','t_artifice'];
function rangeOf(u, id){
  const ab = ABILITIES[id];
  if (u.side === 'hero' && WEAPON_ABILITIES.includes(id)) return targetProfile(u, id).long;
  return ab.range || 0;
}
function validTarget(u, id, c, r){
  const ab = ABILITIES[id]; const d = dist(u, {c, r});
  if (ab.target === 'self') return true;
  const t = unitAt(c, r);
  if (u.side === 'hero' && WEAPON_ABILITIES.includes(id)){
    const P = targetProfile(u, id);
    if (P.cone) return d >= 1 && d <= P.cone && !(c === u.c && r === u.r);
    if (!t || t.side === u.side || hidden(t)) return false;
    if (P.ranged){ if (d > P.long) return false; if (losInfo(u, t, [u, t]).blocked) return false; return true; }
    return d <= P.reach;
  }
  if (d > (ab.range || 0)) return false;

    if (!t || t.side === u.side || hidden(t)) return false;
    if (ab.kind === 'charge'){ if (d <= 1) return true; const path = chargePath(u, t); return !!path && path.length <= ab.range; }
    if (ab.kind === 'spell' && losInfo(u, t, [u, t]).blocked) return false;
    return true;
  }
  if (ab.target === 'ally') return !!t && t.side === u.side && t.alive;
  if (ab.target === 'tile') return walk0(c, r) && (G.revealed || r > 6) && !(ab.kind === 'fireball' && losInfo(u, {c, r}, [u]).blocked);

function chargePath(u, t){
  const map = bfs(u, 6); let best = null;
  for (const [dc, dr] of DIRS){ const n = map.get(tileKey(t.c + dc, t.r + dr)); if (n && (!best || n.d < best.d)) best = n; }

function hitChance(bonus, def){ return clamp((21 - (def - bonus)) / 20, .05, .95); }
function attackPreview(u, id, t){
  const P = targetProfile(u, id);
  const parts = [[P.attr || 'ataque', P.attr ? modOf(u, P.attr) : 0]];
  if (P.def ? trained(u, P.def.fam) : P.unarmed) parts.push(['prof', prof(u)]);
  if (P.def?.props.precisa) parts.push(['precisa', 1]);
  if (id === 't_arcos') parts.push(['mirado', 2]);
  const bonus = parts.reduce((s, p) => s + p[1], 0);
  const L = P.ranged ? losInfo(u, t, [u, t]) : {cover:0};
  const cover = id === 't_arcos' || id === 't_artifice' ? 0 : L.cover;
  const def = caOf(t, {ranged:P.ranged}) + cover - (P.def?.props.perfura ? 1 : 0) - (id === 't_artifice' ? 2 : 0);

/* --- Execução --- */
async function perform(u, id, c, r){
  if (isGuest()){ netIntent(u, {k:'perform', id, c, r}); G.aim = null; clearHl(); hideTip(); renderHotbar(); return; }
  const ab = abilityInfo(u, id);
  if (!canUse(u, id).ok || !validTarget(u, id, c, r)) return;
  G.busy = true; G.aim = null; clearHl(); hideTip(); renderHUD();
  if (ab.cost) u.res -= ab.cost;
  if (ABILITIES[id].cd) u.cd[id] = ABILITIES[id].cd + 1;
  if (G.mode === 'combat'){ const act = actOf(u, id); if (act === 'acao') u.acted = true; else if (act === 'bonus') u.bonus = true; }
  const target = unitAt(c, r);
  if (!(c === u.c && r === u.r)) await faceTo(u, c, r);
  try {
    switch (ab.kind){
      case 'basic': await basicAttack(u, 'main', c, r); break;
      case 'throw': await basicAttack(u, 'throw', c, r); break;

/* =====================================================================
   MOVIMENTO, ATAQUES DE OPORTUNIDADE E VIRAR
   ===================================================================== */
function faceTo(u, c, r){ u.facing = Math.atan2(tx(c) - u.wx, tz(r) - u.wz); return sleep(SET.reduced ? 0 : 140); }
function wakeRadius(u){ return u.kindKey==='aranha'?3:u.kindKey==='lobisomem'?6:5; }
function wouldWake(u){ return u.side === 'hero' && G.units.some(e => e.side === 'enemy' && e.alive && !e.awake && (e.r > 6 || G.revealed) && dist(e, u) <= wakeRadius(e)); }
async function moveAlong(u, path, stepDur=.26, stopIf=null){
  if (!path || !path.length) return 0;
  setAnim(u, 'walk');
  let steps = 0;
  for (const p of path){
    if (stopIf && steps > 0 && stopIf()) break;
    if (G.mode === 'combat'){
      const from = {c:u.c, r:u.r};
      for (const e of G.units){
        if (e === u || !e.alive || e.down || e.side === u.side || e.reactUsed || hasCond(e, 'lento') || hasCond(e, 'atordoado') || hidden(e)) continue;
        const reach = oaReach(e); if (!reach) continue;
        if (dist(e, from) <= reach && dist(e, p) > reach){ setAnim(u, 'idle'); await opportunityAttack(e, u); if (!u.alive || u.down) return steps; setAnim(u, 'walk'); }
      }
    }
    steps++;
    const fx0 = u.wx, fz0 = u.wz, x1 = tx(p.c), z1 = tz(p.r);
    u.facing = Math.atan2(x1 - fx0, z1 - fz0);
    await tween(SET.reduced ? stepDur*.5 : stepDur, q => { const nx=lerp(fx0,x1,q),nz=lerp(fz0,z1,q);u.walkDistance=(u.walkDistance||0)+Math.hypot(nx-u.wx,nz-u.wz);u.wx=nx;u.wz=nz; });
    u.c = p.c; u.r = p.r; sfx('step');
    if(u.side==='hero')directionExplore();
    if (u.anim.name !== 'walk') setAnim(u, 'walk');
  }
  setAnim(u, 'idle');
  return steps;
}
function frightBlocks(u, c, r){
  const f = u.conds.amedrontado; if (!f || !f.src || !f.src.alive) return false;
  return dist({c, r}, f.src) < dist(u, f.src);
}
async function moveUnit(u, c, r){
  if (isGuest()){ netIntent(u, {k:'move', c, r}); return; }
  const map = bfs(u, G.mode === 'combat' ? u.moveLeft : 40);
  const n = map.get(tileKey(c, r)); if (!n || n.d === 0) return;
  if (G.mode === 'combat' && frightBlocks(u, c, r)){ toast('Amedrontado: não pode terminar mais perto de quem o assustou.'); return; }
  const path = pathFrom(map, c, r);
  G.busy = true; clearHl(); hideTip(); renderHUD();
  const steps = await moveAlong(u, path, .26, G.mode === 'explore' ? () => wouldWake(u) : null);
  if (G.mode === 'combat'){ u.moveLeft = Math.max(0, u.moveLeft - steps); u.moved = (u.moved || 0) + steps; }
  G.busy = false;
  checkTriggers();
  afterAction();
}

/* =====================================================================
   TURNOS, INICIATIVA E GATILHOS
   ===================================================================== */
function checkTriggers(){
  directionExplore();
  if (!G.revealed && G.units.some(u => u.side === 'hero' && u.alive && !u.down && u.r <= 9)) revealSanctum();
  const heroes = G.units.filter(u => u.side === 'hero' && u.alive && !u.down);
  const woke = [];
  for (const e of G.units){
    if (e.side !== 'enemy' || !e.alive || e.awake || (e.r <= 6 && !G.revealed)) continue;
    if (heroes.some(hh => dist(hh, e) <= wakeRadius(e))){
      for (const z of G.units) if (z.side === 'enemy' && z.alive && !z.awake && z.zone === e.zone && (z.r > 6 || G.revealed)){ z.awake = true; woke.push(z); }
    }
  }
  if (woke.length){ if (G.mode === 'explore') startCombat(woke); else if (G.mode === 'combat') joinCombat(woke); }
}
function revealSanctum(){
  if (G.revealed) return;
  G.revealed = true; sfx('reveal');
  if(G.scenario==='cripta'){
    questEcho('Diante do Arauto');
    logMsg('A névoa sobre o santuário se dissipa. Algo enorme se ergue entre as runas.', 'sys');
    banner('O Santuário Desperta', 'O Arauto do Abismo espera do outro lado da ponte.');
  }else{
    logMsg('A névoa recua e revela os guardiões ao norte. Há marcas recentes junto ao objetivo.', 'sys');
    banner('Rastros na névoa', 'O caminho ao norte está revelado.');
  }
  let t = 0; const mist=W3.mist,light=W3.runeLight,top=W3.sanctumTop,m0=mist.material.opacity;
  addFx(dt => { t += dt; const q = clamp(t/2.2, 0, 1); mist.material.opacity = m0 * (1 - q); light.intensity = 2.6 * q; top.emissiveIntensity = .15 + q; if (q >= 1){ mist.visible = false; return false; } });
  G.units.forEach(u => { if (u.r <= 6) u.m.root.visible = true; });
}
function rollInitiative(u){

  recordRoll(u.name, 'Iniciativa', 20, [f], f + I.total, `d20 ${f} ${fmtParts(I.parts)} = ${f + I.total}`);
}
function startCombat(woke){

  const parts = G.units.filter(u => u.alive && !u.down && (u.side === 'hero' || u.awake));
  parts.forEach(u => { rollInitiative(u); u.struck = false; });
  G.order = parts.sort((a, b) => b.init - a.init);
  G.turnIdx = 0;
  logMsg(`Combate! ${woke.map(w => w.name).join(', ')} ${woke.length > 1 ? 'despertam' : 'desperta'}.`, 'sys');
  banner('Combate', 'Movimento, uma ação, uma ação bônus e uma reação por rodada.');
  G.units.forEach(u => { if (u.side === 'hero') u.res = Math.max(u.res, CLASSES[u.clsKey].resStart); });

}
function joinCombat(woke){ woke.forEach(w => { rollInitiative(w); w.struck = false; G.order.push(w); }); logMsg(`${woke.map(w => w.name).join(', ')} entra(m) no combate.`, 'sys'); renderHUD(); }
async function beginTurn(){
  if (G.mode !== 'combat') return;
  G.order = G.order.filter(u => u.alive);
  if (!G.order.length) return;
  if (G.turnIdx >= G.order.length){ G.turnIdx = 0; G.round++; }
  const u = G.order[G.turnIdx];
  G.active = u; G.sel = u; G.aim = null;
  if (u.down || !u.alive){ G.turnIdx++; return beginTurn(); }
  u.speed = speedInfo(u).total;
  u.moveLeft = u.speed; u.acted = false; u.bonus = false; u.reactUsed = false; u.moved = 0; u.drained = false; u.swapped = false;
  for (const k in u.cd) if (u.cd[k] > 0) u.cd[k]--;
  if (u.side === 'hero' && G.round > 1){ const cls = CLASSES[u.clsKey]; u.res = Math.min(u.resMax, u.res + cls.resRegen); }
  sfx('turn'); focusCamera(u); renderHUD();
  await startOfTurnConds(u);
  if (!u.alive || u.down) return endTurn(true);
  if (u.conds.atordoado){ delete u.conds.atordoado; u.conds.imune_atordoar = {t:2}; logMsg(`${u.name} está Atordoado e perde o turno.`); floatText(unitPos(u, u.m.height + .5), 'Atordoado', '#f3d36b'); await sleep(900); return endTurn(); }
  if (u.kindKey === 'arauto' && G.telegraph && G.telegraph.owner === u){ await detonateTelegraph(); if (G.mode !== 'combat') return; }
  if (u.kindKey === 'arauto' && !u.summoned && u.hp <= u.maxHp/2) await bossSummon(u);
  renderHUD();
  if (u.side === 'enemy' && !SET.gmControl) await runAI(u);
  else updatePreview();
}
async function endTurn(skipConds){
  if (isGuest()){ if (G.active && canControl(G.active)) netIntent(G.active, {k:'endTurn'}); return; }
  if (G.mode !== 'combat' || G.ending) return;
  G.ending = true;
  G.aim = null; clearHl(); hideTip();
  const u = G.order[G.turnIdx];
  if (u && !skipConds) await endOfTurnConds(u);
  if (u?.side==='hero') { u.tension=DR.turnEnd(u.tension); saveParty(); }
  G.turnIdx++;
  if (G.turnIdx >= G.order.length){ G.turnIdx = 0; G.round++; logMsg(`Rodada ${G.round}.`, 'sys'); }
  G.ending = false;
  renderHUD();
  await sleep(220);
  beginTurn();
}
function afterAction(){
  if (isHost()) netPartySync();
  if (G.mode === 'combat' && !G.units.some(u => u.side === 'enemy' && u.alive && u.awake)){ endCombat(); return; }
  renderHUD(); updatePreview();
}
function endCombat(){
  DIRECTOR.quiet=DIRECTOR.elapsed+25;
  G.mode = 'explore'; G.order = []; G.active = null; G.aim = null;
  if (G.telegraph){ G.telegraph.meshes.forEach(m => disposeObj(m)); G.telegraph = null; }
  const recovered = [];
  G.units.forEach(u => {
    if (u.side !== 'hero') return;
    u.conds = {}; u.cd = {}; u.res = u.resMax; u.temp = 0;
    let changed = false;
    for (const it of u.inv){ const d = wdef(it); if (!d || d.shield) continue; if (it.thrownOut){ it.thrownOut = false; changed = true; recovered.push(d.n); } if (d.props.qty && it.qty < d.props.qty){ it.qty = d.props.qty; recovered.push(d.n); } if (d.props.recarga || d.props.carregamento || d.props.pistao) it.loaded = true; if (d.props.rep) it.mag = d.props.rep; }
    if (changed) refreshModel(u);
    drawHpBar(u);
  });
  logMsg(`O silêncio volta. Recursos de classe cheios e recargas zeradas; os PV só voltam com cura.${recovered.length ? ' Armas arremessadas recolhidas.' : ''}`, 'sys');
  if (!G.won) banner('Silêncio', 'Explore livremente. Troque de equipamento sem custo.');
  if (!G.sel || G.sel.side !== 'hero' || G.sel.down) G.sel = G.units.find(u => u.side === 'hero' && !u.down);
  saveParty();
  renderHUD(); updatePreview();
}
async function bossSummon(u){
  u.summoned = true;
  setAnim(u, 'roar'); sfx('roar'); camShake(.4);
  logMsg('O Arauto ruge. O chão do santuário se abre e mortos sobem.', 'hit');
  banner('O Abismo responde', 'Dois esqueletos emergem do chão.');
  const spots = [];
  for (const [dc, dr] of [[-2,0],[2,0],[0,-2],[-2,-1],[2,-1],[0,2]]){ const c = u.c + dc, r = u.r + dr; if (walkable(c, r) && !unitAt(c, r)) spots.push([c, r]); if (spots.length >= 2) break; }
  for (const [c, r] of spots){
    const s = makeMonster('esqueleto', c, r, true); G.units.push(s);
    s.m.root.position.y = -2; burst({pos:new THREE.Vector3(tx(c), .2, tz(r)), n:40, color:0x6fd8ff, speed:2.5, up:2, life:1});
    let t = 0; addFx(dt => { t += dt; s.m.root.position.y = lerp(-2, 0, ease(t/1.3)); if (t >= 1.4){ s.m.root.position.y = 0; return false; } });
    rollInitiative(s); G.order.push(s);
  }

}

/* =====================================================================
   INTELIGÊNCIA DOS MONSTROS
   ===================================================================== */
async function runAI(u){
  await sleep(450);
  if (G.mode !== 'combat' || G.active !== u) return;
  const heroes = G.units.filter(x => x.side === 'hero' && x.alive && !x.down);
  if (!heroes.length) return;
  if (u.kindKey === 'arauto' && !G.telegraph && (u.cd.b_fenda || 0) <= 0){
    let best = null;
    for (const hh of heroes){ if (dist(u, hh) > ABILITIES.b_fenda.range) continue; const n = heroes.filter(o => Math.abs(o.c - hh.c) <= 1 && Math.abs(o.r - hh.r) <= 1).length; if (!best || n > best.n) best = {c:hh.c, r:hh.r, n}; }
    if (best && (best.n >= 2 || Math.random() < .6)){ u.acted = false; await perform(u, 'b_fenda', best.c, best.r); u.acted = false; if (G.active !== u || G.mode !== 'combat') return; }
  }
  const full = bfs(u, 60);
  const reachTo = t => { let best = null; for (const [dc, dr] of DIRS){ const n = full.get(tileKey(t.c + dc, t.r + dr)); if (n && (!best || n.d < best.d)) best = n; } return best; };
  let scored = heroes.map(t => ({t, adj:dist(u, t) === 1, node:reachTo(t)})).filter(s => s.adj || s.node);
  if (!scored.length) scored = heroes.map(t => ({t, adj:false, node:null}));
  scored.sort((a, b) => {
    if (MONSTERS[u.kindKey].ai === 'weakest'){ const wa = a.adj || (a.node && a.node.d <= u.moveLeft) ? 0 : 1, wb = b.adj || (b.node && b.node.d <= u.moveLeft) ? 0 : 1; if (wa !== wb) return wa - wb; return a.t.hp - b.t.hp; }
    return (a.adj ? 0 : a.node ? a.node.d : 99) - (b.adj ? 0 : b.node ? b.node.d : 99);
  });
  const goal = scored[0];
  if (!goal.adj && goal.node && !(u.conds.amedrontado && u.conds.amedrontado.src === goal.t)){
    let path = (pathFrom(full, goal.node.c, goal.node.r) || []).slice(0, u.moveLeft);
    if (path.length){ G.busy = true; await moveAlong(u, path); G.busy = false; }
  }
  if (!u.alive || G.mode !== 'combat' || G.active !== u) return;
  const adjHeroes = heroes.filter(t => t.alive && !t.down && dist(u, t) === 1);
  if (adjHeroes.length){
    if (u.kindKey === 'arauto' && adjHeroes.length >= 2){ u.acted = false; await perform(u, 'm_talho', u.c, u.r); }
    else { const t = adjHeroes.sort((a, b) => a.hp - b.hp)[0]; u.acted = false; await perform(u, 'm_ataque', t.c, t.r); }
  }
  await sleep(350);
  if (G.mode === 'combat' && G.active === u) endTurn();
}

const CAM = {target:new THREE.Vector3(0, 0, 10), want:new THREE.Vector3(0, 0, 10), az:.35, pol:.62, rad:24, wantRad:24, wantPol:.62};
function setCamMode(mode){
  SET.cam = mode; saveSet();
  if (mode === 'tatica'){ CAM.wantPol = .42; CAM.wantRad = 27; }
  else { CAM.wantPol = 1.0; CAM.wantRad = 10; }
  if (G.sel) focusCamera(G.sel);
  renderOpts();
}
function focusCamera(u){ if (!u) return; if (SET.cam === 'proxima') CAM.want.set(u.wx, 0, u.wz); else CAM.want.set(u.wx * .6, 0, u.wz); }
function updateCamera(dt){
  const k = 1 - Math.exp(-dt * 4);
  if (SET.cam === 'proxima' && G.sel) CAM.want.set(G.sel.wx, 0, G.sel.wz);
  CAM.target.lerp(CAM.want, k);
  CAM.rad += (CAM.wantRad - CAM.rad) * k; CAM.pol += (CAM.wantPol - CAM.pol) * k;
  const t = CAM.target;
  camera.position.set(t.x + Math.sin(CAM.az)*Math.sin(CAM.pol)*CAM.rad, t.y + Math.cos(CAM.pol)*CAM.rad + .5, t.z + Math.cos(CAM.az)*Math.sin(CAM.pol)*CAM.rad);
  if (shake > 0){ camera.position.x += (Math.random()-.5)*shake; camera.position.y += (Math.random()-.5)*shake; shake = Math.max(0, shake - dt*1.6); }
  camera.lookAt(t.x, t.y + .8, t.z);
  // paredes entre a câmera e a mesa ficam translúcidas
  for (const w of W3.walls){
    const toCam = new THREE.Vector3().subVectors(camera.position, w.position); toCam.y = 0;
    const n = w.userData.normal; const behind = toCam.dot(n) < 0;
    const want = behind ? (w.userData.fadeOpacity??.16) : 1;
    for (const m of w.userData.mats){ m.opacity += (want - m.opacity) * k * 2; m.depthWrite = m.opacity > .9; }
  }
}

function solveSupportHand(J){
  J.body.updateWorldMatrix(true,true);
  for(let i=0;i<6;i++){
    const current=J.spine.worldToLocal(J.supportGrip.getWorldPosition(new THREE.Vector3()));
    const fromLeft=current.clone().sub(J.armL.position);
    if(fromLeft.length()<.565)break;
    const desired=J.armL.position.clone().add(fromLeft.setLength(.55));
    const rotation=new THREE.Quaternion().setFromUnitVectors(current.sub(J.armR.position).normalize(),desired.sub(J.armR.position).normalize());
    J.armR.quaternion.premultiply(rotation);J.body.updateWorldMatrix(true,true);

  const target=J.spine.worldToLocal(J.supportGrip.getWorldPosition(new THREE.Vector3()));
  const shoulder=J.armL.position.clone(), delta=target.clone().sub(shoulder), distance=delta.length();
  if(distance<.001)return;
  const direction=delta.clone().normalize(), a=.3,b=.28,d=clamp(distance,.025,a+b-.002);
  const along=(a*a-b*b+d*d)/(2*d), height=Math.sqrt(Math.max(0,a*a-along*along));
  const pole=new THREE.Vector3(1,-.5,-.45);pole.addScaledVector(direction,-pole.dot(direction)).normalize();
  const elbow=shoulder.clone().addScaledVector(direction,along).addScaledVector(pole,height);
  J.armL.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0),elbow.clone().sub(shoulder).normalize());
  const endpoint=shoulder.clone().addScaledVector(direction,d);
  const forearm=endpoint.sub(elbow).applyQuaternion(J.armL.quaternion.clone().invert()).normalize();
  J.elbowL.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0),forearm);
  J.body.updateWorldMatrix(true,true);

function buildAlternateWorld(){

 const floor=tint(TX.rock,key==='floresta'?0x354331:0x525c63,{roughness:.78,metalness:.04});
 const ground=mk(box(19,.7,34),floor,0,-.38,0);scene.add(ground);
 const dark=std(0x090d12),roof=std(0x272b34,{roughness:.8});
 const addLamp=(x,z)=>{scene.add(mk(cyl(.035,.06,1.8,8),iron,x,.9,z));scene.add(flame(x,1.9,z,.65));const l=new THREE.PointLight(key==='floresta'?0xa1c8a2:0xffba73,1.6,6,2);l.position.set(x,1.7,z);l.userData.base=1.6;scene.add(l);W3.torchLights.push(l);};
 const branch=(g,a,b,r)=>{const start=new THREE.Vector3(...a),end=new THREE.Vector3(...b),delta=end.clone().sub(start);const m=mk(cyl(r*.65,r,delta.length(),8),wood,...start.add(end).multiplyScalar(.5).toArray());m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),delta.normalize());g.add(m);};
 const tree=(x,z,i,small=false)=>{const g=new THREE.Group();g.position.set(x,0,z);const height=small?2.5:4.2+(i%3)*.4;branch(g,[0,0,0],[.25,height*.6,.1],.25);branch(g,[.25,height*.6,.1],[-.35,height,.1],.15);for(const side of [-1,1]){branch(g,[.15,height*.45,0],[side*.9,height*.75,.25],.11);branch(g,[side*.9,height*.75,.25],[side*1.35,height*.8,-.1],.045);branch(g,[side*.75,height*.7,.2],[side*.65,height*.95,.25],.05);}scene.add(g);};
 const house=(x,z,i)=>{
   const g=new THREE.Group();g.position.set(x,0,z);g.add(mk(box(2.5,2.8,2.8),stone,0,1.4,0));
   for(const side of [-1,1]){const pitch=mk(box(1.9,.15,3.15),roof,side*.65,3.1,0);pitch.rotation.z=side*-.6;g.add(pitch);}
   g.add(mk(box(.65,1.55,.04),wood,0,.8,1.42));
   for(const side of [-1,1]){g.add(mk(box(.45,.55,.04),dark,side*.8,1.65,1.42));for(let b=0;b<3;b++){const plank=mk(box(.55,.06,.07),wood,side*.8,1.5+b*.15,1.46);plank.rotation.z=(i%2?.22:-.16);g.add(plank);}}
   for(const side of [-1,1])g.add(mk(box(.1,2.8,.1),wood,side*1.23,1.4,1.4));g.rotation.y=x>0?-Math.PI/2:Math.PI/2;scene.add(g);
 };
 if(key==='vila'){
   for(let i=0;i<6;i++){house(-11,-13+i*5,i);house(11,-11+i*5,i+1);}
   const well=mk(new THREE.TorusGeometry(.6,.18,10,24),stone,-5,.65,6);well.rotation.x=Math.PI/2;scene.add(well);
   for(let i=0;i<7;i++){const plank=mk(box(.12,.08,1.5),wood,5+i*.12,.2,10);plank.rotation.y=.15;scene.add(plank);}
 }else if(key==='floresta'){
   for(let i=0;i<28;i++)tree((i%2?-1:1)*(10+(i%3)*1.3),-17+Math.floor(i/2)*2.5,i);
   const water=mk(new THREE.PlaneGeometry(3,34),std(0x192d2b,{roughness:.12,metalness:.5}),-6,.015,0,false);water.rotation.x=-Math.PI/2;scene.add(water);
 }else{
   for(const side of [-1,1]){
    for(let i=0;i<9;i++){scene.add(mk(box(1.1,3+(i%3)*.4,3.2),stone,side*10,1.6,-14+i*3.7));scene.add(mk(box(1.4,.4,.7),iron,side*10,3.5,-14+i*3.7));}
    const tower=mk(cyl(1.6,1.9,7,12),stone,side*9,3.5,-15);scene.add(tower);
    for(let i=0;i<8;i++){const angle=i*Math.PI/4;scene.add(mk(box(.5,.8,.5),stone,side*9+Math.sin(angle)*1.5,7,-15+Math.cos(angle)*1.5));}
   }
   for(const x of [-6,6]){const cloth=new THREE.Mesh(new THREE.PlaneGeometry(1.2,3),tint(TX.cloth,0x5f1e2b,{side:THREE.DoubleSide,roughness:1}));cloth.position.set(x,3.2,-12);scene.add(cloth);}
 }
 for(let r=0;r<GH;r++)for(let c=0;c<GW;c++)if(MAP[r][c]==='P'){
   if(key==='floresta')tree(tx(c),tz(r),c+r,true);
   else if(key==='castelo'){scene.add(mk(cyl(.38,.5,3.7,12),stone,tx(c),1.85,tz(r)));scene.add(mk(box(1.05,.25,1.05),stone,tx(c),3.8,tz(r)));}
   else{scene.add(mk(box(.95,.65,.95),wood,tx(c),.33,tz(r)));const wheel=mk(new THREE.TorusGeometry(.35,.045,8,16),iron,tx(c)+.5,.35,tz(r));wheel.rotation.y=Math.PI/2;scene.add(wheel);}
 }
 for(const [x,z]of[[-7,13],[7,13],[-7,4],[7,-3],[-6,-12],[6,-12]])addLamp(x,z);
 W3.sanctumTop=std(0x55606a,{emissive:0x7fa9b4,emissiveIntensity:.15});scene.add(mk(cyl(1.5,1.7,.18,24),W3.sanctumTop,0,.08,-13.5));
 W3.runeLight=new THREE.PointLight(0x7cb4ca,0,15,2);W3.runeLight.position.set(0,2,-13);scene.add(W3.runeLight);
 W3.mist=mk(cyl(8,8,7,32),new THREE.MeshBasicMaterial({color:region.color,transparent:true,opacity:.94,depthWrite:false}),0,2.5,-13,false);scene.add(W3.mist);
 const bg=mk(new THREE.PlaneGeometry(300,300),std(key==='floresta'?0x17231b:0x161e28),0,-1,0,false);bg.rotation.x=-Math.PI/2;scene.add(bg);
}
function rebuildRegion(key){
 if(!REGIONS[key])key='cripta';
 const sharedTextures=new Set(Object.values(TX)),retiredTextures=new Set();
 for(const node of W3.worldNodes||[])node.traverse(o=>{for(const mat of (Array.isArray(o.material)?o.material:[o.material]).filter(Boolean))for(const value of Object.values(mat))if(value?.isTexture&&!sharedTextures.has(value))retiredTextures.add(value);});
 for(const node of W3.worldNodes||[])disposeObj(node);
 for(const texture of retiredTextures)texture.dispose();
 W3.cavern=null;
 for(const field of ['walls','torches','torchLights','highlights','shafts','islands','crystals'])W3[field]=[];
 W3.motes=null;W3.hlUsed=0;DIRECTOR.fog=[];DIRECTOR.silhouettes=[];
 MAP=regionMap(key);G.scenario=key;
 const before=new Set(scene.children);buildWorld();buildDreadScene();buildQuestMarkers();
 W3.worldNodes=scene.children.filter(n=>!before.has(n));
 scene.background.setHex(REGIONS[key].color);scene.fog.color.setHex(REGIONS[key].color);applyQuality();
}
function travelRegion(key){
 if(isGuest()||G.busy||G.mode==='combat'||!REGIONS[key])return;
 const records=G.units.filter(u=>u.side==='hero').map(serializeHero);
 resetLocalGame();rebuildRegion(key);G.defeated=0;G.bossDefeated=false;
 startGame(null,records);logMsg(`O grupo chega a ${REGIONS[key].name}.`,'sys');
 saveCampaign();if(isHost())netSend({t:'region',area:key});
}
function saveCampaign(){if(isGuest())return;try{localStorage.setItem('ecos.campaign.v1',JSON.stringify({state:campaign,area:G.scenario}));}catch(e){}}
function restoreCampaign(){try{const saved=JSON.parse(localStorage.getItem('ecos.campaign.v1')||'null');if(saved){campaign=QUEST.normalize(saved.state);if(REGIONS[saved.area]&&saved.area!==G.scenario)rebuildRegion(saved.area);}}catch(e){}}
function campaignEvidence(u){return {area:G.scenario,mode:G.mode,c:u?.c,r:u?.r,alive:u?.alive,down:u?.down,kills:G.defeated||0,boss:!!G.bossDefeated};}
function campaignUpdate(state){campaign=QUEST.normalize(state);saveCampaign();updateQuestMarkers();renderHUD();}
function startCampaign(){
 if(isGuest()||G.busy||G.mode==='combat'||campaign.active)return;
 if(online()){netSend({t:'missionStart'});return;}
 campaign=QUEST.initial();campaign.active=true;campaign.side=QUEST.normalize(campaign).side;campaign.journal=[QUEST.DATA.intro];campaign.revision++;
 campaignUpdate(campaign);travelRegion('vila');openMissionBook();
}
function acceptSide(id){
 if(isGuest()){netSend({t:'missionAccept',id});return;}
 if(online()){netSend({t:'missionAccept',id});return;}
 if(!campaign.active||!QUEST.DATA.side.some(q=>q.id===id)||['active','completed'].includes(campaign.side[id]))return;
 campaign.side[id]='active';campaign.revision++;campaignUpdate(campaign);
}
async function interactQuest(u,id,ending){
 if(!u||G.busy||!canControl(u))return;
 const error=QUEST.eligibility(campaign,id,campaignEvidence(u));if(error){toast(error);return;}
 const q=QUEST.objective(campaign,id);
 if(q.boss&&!ending){if(isGuest()){toast('O Mestre conduz a escolha final no diário.');return;}openMissionEnding(u);return;}
 if(isGuest()){netIntent(u,{k:'missionInteract',quest:id});return;}
 if(online()){
   setAnim(u,'interact');netSend({t:'snap',s:buildSnap()});netSend({t:'missionProgress',id,hero:u.hid,revision:campaign.revision,ending});return;
 }
 const result=QUEST.advance(campaign,id,campaignEvidence(u),ending);if(result.error){toast(result.error);return;}
 setAnim(u,'interact');G.units.filter(x=>x.side==='hero').forEach(x=>x.gold+=result.gold);
 logMsg(`${result.title} concluída: ${result.gold} moedas para cada protagonista.`,'sys');campaignUpdate(result.state);saveParty();
}
function openMissionEnding(u){
 UI.missionModal=false;
 openModal(md=>md.append(h('span',{class:'eyebrow',text:'Decisão do grupo · conduzida pelo Mestre'}),h('h1',{text:'O destino dos nomes'}),h('p',{text:QUEST.DATA.steps[4].dialogue}),
 ...Object.entries(QUEST.DATA.endings).map(([id,e])=>h('button',{class:'btn',type:'button',onclick:()=>{closeModal();interactQuest(u,'main',id);openMissionBook();}},e.title,h('small',{text:e.text}))),h('button',{class:'btn',type:'button',onclick:()=>{closeModal();openMissionBook();}},'Ainda não decidir')));
}
function missionViewKey(){return JSON.stringify([campaign.revision,G.scenario,G.mode,G.busy,G.defeated,G.bossDefeated,G.sel?.id,G.units.filter(u=>u.side==='hero').map(u=>[u.c,u.r,u.alive,u.down,u.owner])]);}
function openMissionBook(){
 UI.missionKey=missionViewKey();
 UI.missionModal=true;

  md.classList.add('mission-book');
  const stage=QUEST.DATA.steps[campaign.step],hero=G.sel?.side==='hero'?G.sel:G.units.find(u=>canControl(u));
  md.append(h('span',{class:'eyebrow',text:'Diário da expedição'}),h('h1',{text:QUEST.DATA.title}),h('p',{class:'lead',text:QUEST.DATA.intro}));
  if(!campaign.active)md.append(h('button',{class:'btn go',type:'button',disabled:isGuest()||G.mode==='setup'||G.mode==='combat',onclick:startCampaign},'Iniciar missão principal',h('small',{text:'O Mestre inicia a expedição em Valdenegro com o grupo atual.'})));
  else if(campaign.completed){const e=QUEST.DATA.endings[campaign.ending];md.append(h('h2',{text:e?.title||'Missão concluída'}),h('p',{text:e?.text||''}));}
  else{
   const reason=QUEST.eligibility(campaign,'main',campaignEvidence(hero));
   md.append(h('div',{class:'direction-card'},h('span',{class:'eyebrow',text:`Missão principal · ${campaign.step+1}/${QUEST.DATA.steps.length}`}),h('h2',{text:stage.title}),h('p',{text:stage.objective}),h('p',{class:'note',text:`${REGIONS[stage.area].name} · coluna ${stage.c+1}, linha ${stage.r+1} · recompensa: ${stage.gold} moedas por herói.`}),
    G.scenario!==stage.area?h('button',{class:'btn go',type:'button',disabled:isGuest()||G.mode==='combat'||G.busy,onclick:()=>{travelRegion(stage.area);openMissionBook();}},`Viajar para ${REGIONS[stage.area].name}`):h('button',{class:'btn go',type:'button',disabled:!!reason||!canControl(hero),onclick:()=>interactQuest(hero,'main')},stage.boss?'Decidir o destino do selo':'Interagir com o objetivo'),
    G.scenario===stage.area&&(stage.kills||stage.boss)?h('p',{class:'note',text:stage.boss?(G.bossDefeated?'Arauto vencido.':'O Arauto ainda guarda o selo.'):`Guardiões vencidos: ${Math.min(G.defeated,stage.kills)}/${stage.kills}.`}):null,
    reason?h('p',{class:'note',text:reason}):null,h('button',{class:'btn',type:'button',disabled:G.scenario!==stage.area,onclick:()=>{CAM.want.set(tx(stage.c),0,tz(stage.r));closeModal();}},'Mostrar no mapa')));
  }
  if(campaign.active){
   md.append(h('h2',{text:'Missões secundárias'}),...QUEST.DATA.side.map(q=>{
    const status=campaign.side[q.id]||'available',reason=QUEST.eligibility(campaign,q.id,campaignEvidence(hero));
    return h('div',{class:'direction-card'},h('b',{text:q.title}),h('p',{text:q.objective}),h('p',{class:'note',text:`${REGIONS[q.area].name} · coluna ${q.c+1}, linha ${q.r+1} · ${q.gold} moedas por herói · ${{available:'disponível',active:'em andamento',completed:'concluída'}[status]}`}),
    status==='available'?h('button',{class:'btn',type:'button',onclick:()=>acceptSide(q.id)},'Aceitar missão'):status==='active'?h('button',{class:'btn',type:'button',disabled:!!reason||!canControl(hero),title:reason,onclick:()=>interactQuest(hero,q.id)},'Entregar objetivo'):null,
    status==='active'&&reason?h('p',{class:'note',text:reason}):null,
    status==='active'?h('button',{class:'btn',type:'button',disabled:G.scenario!==q.area,onclick:()=>{CAM.want.set(tx(q.c),0,tz(q.r));closeModal();}},'Mostrar objetivo secundário'):null);
   }),h('details',{class:'direction-card'},h('summary',{text:'Etapas e descobertas'}),QUEST.DATA.steps.map((q,i)=>h('p',{text:`${i<campaign.step?'✓':i===campaign.step?'→':'○'} ${q.title}`})),campaign.journal.map(line=>h('p',{class:'story',text:line}))));
   if(!isGuest())md.append(directionSelect('travelArea','Viagem livre (fora de combate)',G.scenario,Object.entries(REGIONS).map(([id,v])=>[id,v.name]),()=>{}),h('button',{class:'btn',type:'button',disabled:G.mode==='combat'||G.busy,onclick:()=>{travelRegion($('travelArea').value);openMissionBook();}},'Viajar com o grupo'));
  }
  md.append(h('button',{class:'btn',type:'button',onclick:closeModal},'Voltar à mesa'));
 },true);
}
function buildQuestMarkers(){
 W3.questMarkers=[];
 const quests=[...QUEST.DATA.steps.map(q=>({...q,key:'main:'+q.id})),...QUEST.DATA.side.map(q=>({...q,key:q.id}))];
 for(const q of quests.filter(q=>q.area===G.scenario)){
  const group=new THREE.Group();group.position.set(tx(q.c),0,tz(q.r));
  const mat=std(0x8a765a,{metalness:.65,roughness:.4});group.add(mk(box(.55,.85,.45),tint(TX.rock,0x666462),0,.42,0));
  const relic=mk(q.id==='sino'?new THREE.ConeGeometry(.32,.42,16,1,true):q.id==='lanterna'?new THREE.CylinderGeometry(.16,.16,.4,12):box(.35,.08,.3),mat,0,1,0);group.add(relic);
  const ring=mk(new THREE.RingGeometry(.5,.56,32),new THREE.MeshBasicMaterial({color:q.key.startsWith('main')?0xd9b46a:0x8fb8cf,side:THREE.DoubleSide,transparent:true,opacity:.8}),0,.025,0,false);ring.rotation.x=-Math.PI/2;group.add(ring);
  group.userData.quest=q;group.userData.ring=ring;scene.add(group);W3.questMarkers.push(group);
 }
 updateQuestMarkers();
}
function updateQuestMarkers(){for(const marker of W3.questMarkers||[]){const q=marker.userData.quest;marker.visible=campaign.active&&(q.key.startsWith('main')?!campaign.completed&&QUEST.DATA.steps[campaign.step]?.id===q.id:campaign.side[q.id]==='active');}}

  if (!window.THREE || !init3D()){ $('app').append(h('div', {class:'nogl', text:'Não foi possível abrir o WebGL neste navegador. O jogo precisa de aceleração 3D para funcionar.'})); return; }

  if (location.hostname === 'localhost') window.__ecos = {NET, netJoin, netCreate, applySnap, G, perform, endTurn, startGame, defaultParty, closeModal, revealSanctum, moveUnit, unitAt, SET, abilityList, canUse, validTarget, equip, WEAPONS, WEAPON_LIST, buildWeapon, attackProfile, openArsenal, openShop, get renderer(){ return renderer; }, get scene(){ return scene; }, get camera(){ return camera; }};
}
boot();
