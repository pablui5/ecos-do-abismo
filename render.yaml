databases:
  - name: ecos-db
    plan: free
    databaseName: ecos
    user: ecos

services:
  - type: web
    name: ecos-do-abismo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server/app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: ecos-db
          property: connectionString
